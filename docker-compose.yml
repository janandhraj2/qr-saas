version: "3.9"
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_defaults && gunicorn config.wsgi:application -b 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - jar_media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - backend/.env

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  jar_media:
